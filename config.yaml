# Best7DaysMula configuration. CLI flags override these.

filters:
  min_price: 2.00
  min_gain_7d: 8.0
  min_avg_volume: 500000
  min_dollar_vol: 5000000        # $5M daily dollar volume
  max_rsi: 80
  min_pct_52w_high: -15.0        # within 15% of 52-week high
  max_avg_range_pct: 50.0
  market_cap: "all"              # small | mid | large | all
  exclude_extreme_volatility: true

agents:
  # Active strategy agents (comma-listed via --agents to subset)
  agent_names:
    - momentum
    - breakout
    - volume_surge
    - relative_strength
    - mean_reversion

output:
  top_n: 25
  output_dir: "outputs"
  formats:
    - csv
    - json

fetch:
  chunk_size: 60
  max_workers: 4
  sleep_between_chunks: 0.5
  max_retries: 3
  # One year of daily bars. Anything shorter silently degrades the metrics:
  # below ~50 rows ma_50 falls back to ma_20 (and ma_200 to ma_50, so the
  # mean-reversion agent's ma_50 > ma_200 gate never fires), below 35 rows
  # macd_hist is always 0.0, and below 60 rows the "52-week high" is just
  # the window high. The OHLCV cache keys on (ticker, period), so changing
  # this never reads stale rows from a previous period.
  period: "1y"

cache:
  cache_ttl: 3600                # seconds (1 hour)
